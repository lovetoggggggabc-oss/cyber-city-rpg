<html lang="ko">
<head>

<title>HYPER BREAK · 2D 액션</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c19;color:#eafaff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none}#hud{position:absolute;top:calc(12px + env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;text-shadow:0 2px 4px #000}
.glass{background:#091426c9;border:1px solid #4bd9ed66;border-radius:12px;box-shadow:0 6px 24px #0008;backdrop-filter:blur(7px)}#status{padding:10px 12px;min-width:192px}.title{font-size:11px;font-weight:800;letter-spacing:2.2px;color:#7eeefe}.line{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-top:5px}.bar{width:190px;max-width:30vw;height:8px;margin-top:6px;background:#26384d;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f45884,#ffb46b)}#energyBar i{background:linear-gradient(90deg,#278eec,#66efff)}#info{padding:9px 12px;text-align:right;font-size:12px;min-width:130px}#info strong{display:block;font-size:17px;color:#fff}#combo{color:#ffbf74;font-weight:bold}
#hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:7px 10px;border-radius:8px;background:#0a1426bc;color:#c1d7e7;font-size:11px}#message{position:absolute;top:19%;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;letter-spacing:2px;color:#9afaff;text-shadow:0 0 14px #3ed6f9;opacity:0;transition:opacity .2s;white-space:nowrap}#message.show{opacity:1}
#touch{position:absolute;inset:0;pointer-events:none}button{color:#e8faff;background:#17334dcf;border:1px solid #75def8aa;box-shadow:inset 0 0 13px #8ee8ff17,0 4px 13px #0008;touch-action:none;-webkit-user-select:none;user-select:none}button:active,.pressed{background:#2c91b0!important;transform:scale(.94)}.control{position:absolute;border-radius:50%;pointer-events:auto;font-size:14px;font-weight:800}.control small{display:block;font-size:10px;color:#a8d5e3;font-weight:400}.left{bottom:calc(24px + env(safe-area-inset-bottom));width:76px;height:76px}.left#left{left:18px}.left#right{left:106px}.action{width:68px;height:68px;bottom:calc(26px + env(safe-area-inset-bottom))}#attack{right:16px;width:100px;height:100px;background:#8c3565d9;border-color:#ff87b7;font-size:18px}#shoot{right:126px;bottom:calc(31px + env(safe-area-inset-bottom))}#jump{right:31px;bottom:calc(136px + env(safe-area-inset-bottom))}#dash{right:126px;bottom:calc(112px + env(safe-area-inset-bottom))}
#end{position:absolute;inset:0;display:none;place-items:center;background:#040915cf;pointer-events:auto;text-align:center}#end.open{display:grid}#end .panel{padding:24px 32px;max-width:92vw}#end h1{color:#ff8ca8;margin:0 0 8px}#end p{color:#b8d0e0}#restart{border-radius:10px;padding:11px 22px;cursor:pointer}
@media(max-width:700px){#hint{display:none}#status{min-width:150px;padding:7px 9px}#info{min-width:90px;padding:7px 9px}.bar{width:138px}#hud{top:calc(6px + env(safe-area-inset-top));left:7px;right:7px}.line{font-size:10px}.title{font-size:9px}#info strong{font-size:13px}.left{width:63px;height:63px;bottom:calc(13px + env(safe-area-inset-bottom))}.left#left{left:8px}.left#right{left:80px}.action{width:55px;height:55px;font-size:11px;bottom:calc(15px + env(safe-area-inset-bottom))}#attack{width:77px;height:77px;right:6px;font-size:15px}#shoot{right:90px;bottom:calc(16px + env(safe-area-inset-bottom))}#jump{right:12px;bottom:calc(100px + env(safe-area-inset-bottom))}#dash{right:84px;bottom:calc(82px + env(safe-area-inset-bottom))}}

:root{--stick-size:112px;--stick-left:18px;--stick-bottom:18px}
#stick{position:absolute;left:var(--stick-left);bottom:calc(var(--stick-bottom) + env(safe-area-inset-bottom));width:var(--stick-size);height:var(--stick-size);border-radius:50%;background:#1939549c;border:2px solid #78e2f0aa;box-shadow:0 0 25px #15daff21,inset 0 0 25px #2bb5d93d;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:40%;height:40%;border-radius:50%;transform:translate(-50%,-50%);background:#8bedf4b8;border:2px solid #d8fcff;box-shadow:0 0 18px #8df6ff77;pointer-events:none}
#aim{right:126px;bottom:calc(31px + env(safe-area-inset-bottom));background:#195e85df;border-color:#93f3ff}
#settingsButton{display:block;margin:0 0 4px auto;padding:2px 8px;border-radius:7px;font:inherit;font-size:11px;pointer-events:auto;cursor:pointer}
#settings{position:absolute;inset:0;display:none;place-items:center;background:#050b18c9;pointer-events:auto;z-index:10}#settings.open{display:grid}
#settings .panel{width:min(425px,calc(100vw - 26px));max-height:90vh;overflow:auto;padding:20px 22px}#settings h2{margin:0 0 7px;color:#85efff}#settings p{font-size:12px;color:#b8cddc;line-height:1.5}
#settings label{display:block;margin:15px 0;font-size:13px}#settings output{float:right;color:#91e9fb}#settings input{display:block;width:100%;margin:11px 0 0;accent-color:#60e6f9;touch-action:auto}
#settings button{border-radius:9px;padding:9px 12px;margin:6px 8px 0 0;cursor:pointer}
@media(max-width:700px){#aim{right:90px;bottom:calc(16px + env(safe-area-inset-bottom))}#settingsButton{font-size:10px}}
</style>
</head>
<body>
<canvas id="game" aria-label="2D 횡스크롤 액션 게임"></canvas>
<div id="ui">
  <div id="hud"><div id="status" class="glass"><div class="title">HYPER BREAK · PROTOTYPE</div><div class="line"><span>체력</span><b id="hpText">100 / 100</b></div><div class="bar"><i id="hpBar"></i></div><div class="line"><span>에너지</span><b id="energyText">100 / 100</b></div><div class="bar" id="energyBar"><i id="energyFill"></i></div></div><div id="info" class="glass"><button id="settingsButton" aria-label="조작 설정">설정 ⚙</button><span>점수</span><strong id="score">0</strong><span id="wave">웨이브 1</span><div id="combo"></div></div></div>
  <div id="hint">A/D · ←/→ 이동　Space 점프(2회)　J 근접 콤보　K 조준 · 화면 터치 사격　Shift 대시</div><div id="message"></div>
  <div id="touch"><div id="stick" aria-label="이동 조이스틱"><div id="knob"></div></div><button id="dash" class="control action">대시<small>Shift</small></button><button id="aim" class="control action">조준<small>K</small></button><button id="jump" class="control action">점프<small>Space</small></button><button id="attack" class="control action">공격<small>J</small></button></div>
  <div id="settings"><div class="panel glass"><h2>조이스틱 설정</h2><p>크기와 화면 왼쪽·아래에서 떨어진 거리를 조절할 수 있어.</p><label>크기 <output id="sizeValue"></output><input id="stickSize" type="range" min="80" max="180" step="1"></label><label>왼쪽 위치 <output id="leftValue"></output><input id="stickLeft" type="range" min="8" max="220" step="1"></label><label>아래 위치 <output id="bottomValue"></output><input id="stickBottom" type="range" min="8" max="220" step="1"></label><div><button id="resetControls">기본값</button><button id="closeSettings">닫기</button></div></div></div><div id="end"><div class="panel glass"><h1>신호 소실</h1><p id="result"></p><button id="restart">다시 시작</button></div></div>
</div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s);
const WORLD=3200,FLOOR=590,GRAVITY=1800,keys=new Set();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);
const platforms=[{x:0,y:FLOOR,w:WORLD,h:180},{x:430,y:480,w:205,h:20},{x:820,y:422,w:190,h:20},{x:1170,y:490,w:250,h:20},{x:1570,y:430,w:200,h:20},{x:1930,y:470,w:245,h:20},{x:2310,y:405,w:205,h:20},{x:2670,y:475,w:225,h:20}];
let W=innerWidth,H=innerHeight,dpr=1,scale=1,cameraX=0,elapsed=0,last=performance.now(),accum=0,shake=0,flash=0,score=0,wave=1,combo=0,comboClock=0,waveDelay=-1,noticeUntil=0;
let player,enemies=[],shots=[],particles=[],slashes=[],jumpBursts=[],aimRemaining=0,aimFired=false,aimTarget={x:0,y:0},aimCooldown=0,stickX=0,stickPointer=null,settingsOpen=false;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);scale=H/720;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function hero(){return{x:160,y:FLOOR-56,w:32,h:56,vx:0,vy:0,face:1,hp:100,energy:100,onGround:true,jumps:0,coyote:0,jumpBuffer:0,attackTime:0,attackId:0,attackStage:0,comboWindow:0,fireCooldown:0,dashCooldown:0,dashTime:0,invulnerable:0,dead:false}}
function enemy(x,type='runner'){let flying=type==='drone';return{x,y:flying?FLOOR-165:FLOOR-46,w:flying?38:32,h:flying?30:46,vx:0,vy:0,hp:flying?35:55,maxHp:flying?35:55,type,dir:-1,attackCooldown:rand(.5,1.3),hit:0,phase:rand(0,7),lastAttack:0}}
function reset(){player=hero();enemies=[enemy(565),enemy(925,'drone'),enemy(1300),enemy(1710,'drone'),enemy(2050),enemy(2520,'drone')];shots=[];particles=[];slashes=[];jumpBursts=[];aimRemaining=0;aimFired=false;aimCooldown=0;score=0;wave=1;combo=0;comboClock=0;waveDelay=-1;elapsed=0;shake=0;flash=0;$('#end').classList.remove('open');message('BREAK IN · 콤보를 이어가!');last=performance.now();accum=0}
$('#restart').addEventListener('click',reset);reset();
function message(text){$('#message').textContent=text;$('#message').classList.add('show');noticeUntil=elapsed+1.6}
function sparks(x,y,color,count=12){for(let i=0;i<count;i++)particles.push({x,y,vx:rand(-260,260),vy:rand(-320,110),life:rand(.18,.48),max:.48,color,size:rand(2,5)})}
function jump(){if(player.dead)return;player.jumpBuffer=.12}
function dash(){if(player.dead||player.dashCooldown>0)return;player.dashTime=.16;player.dashCooldown=.75;player.vx=player.face*850;player.vy*=.25;player.invulnerable=Math.max(player.invulnerable,.22);shake=6;sparks(player.x+16,player.y+32,'#69ecff',8)}
function attack(){if(player.dead||player.attackTime>0)return;player.attackStage=player.comboWindow>0?(player.attackStage%3)+1:1;player.attackTime=[0,.23,.27,.34][player.attackStage];player.comboWindow=.57;player.attackId++;slashes.push({x:player.x+16+player.face*37,y:player.y+27,face:player.face,stage:player.attackStage,life:.19,max:.19});shake=3}
function aim(){if(player.dead||settingsOpen||aimRemaining>0||aimCooldown>0)return;if(player.energy<25){message('에너지가 부족해');return}player.energy-=25;aimRemaining=.5;aimFired=false;aimCooldown=.85;aimTarget={x:player.x+16+player.face*500,y:player.y+26};message('FOCUS · 화면을 터치해 발사')}
function aimedShot(){if(player.dead||aimRemaining<=0||aimFired)return;aimFired=true;let mx=player.x+16,my=player.y+26,dx=aimTarget.x-mx,dy=aimTarget.y-my,len=Math.hypot(dx,dy)||1;if(dx)player.face=Math.sign(dx);shots.push({x:mx+dx/len*28,y:my+dy/len*28,vx:dx/len*1700,vy:dy/len*1700,life:.85,enemy:false,damage:36});sparks(mx+player.face*24,my,'#94f6ff',12);shake=5}
function targetAt(e){aimTarget.x=clamp(cameraX+e.clientX/scale,0,WORLD);aimTarget.y=clamp(e.clientY/scale,20,FLOOR+30)}
let aimingTouch=null;canvas.addEventListener('pointerdown',e=>{if(aimRemaining<=0)return;e.preventDefault();targetAt(e);if(e.pointerType==='mouse')aimedShot();else{aimingTouch=e.pointerId;canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(aimRemaining>0&&(e.pointerType==='mouse'||e.pointerId===aimingTouch))targetAt(e)});canvas.addEventListener('pointerup',e=>{if(e.pointerId===aimingTouch){targetAt(e);aimedShot();aimingTouch=null}});canvas.addEventListener('pointercancel',()=>aimingTouch=null);

const action={jump,dash,attack,aim};for(let [id,fn] of Object.entries(action))$('#'+id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();e.currentTarget.setPointerCapture(e.pointerId);fn()});
const stick=$('#stick'),knob=$('#knob'),controlDefaults={size:112,left:18,bottom:18};let controls={...controlDefaults};
try{let stored=JSON.parse(localStorage.getItem('hyper-break-controls-v1')||'{}');for(let k of Object.keys(controlDefaults))if(Number.isFinite(+stored[k]))controls[k]=+stored[k]}catch{}
const sliders={size:$('#stickSize'),left:$('#stickLeft'),bottom:$('#stickBottom')};
function applyControls(){controls.size=clamp(controls.size,80,180);controls.left=clamp(controls.left,8,Math.max(8,W-controls.size-8));controls.bottom=clamp(controls.bottom,8,Math.max(8,H-controls.size-8));for(let k of Object.keys(sliders)){sliders[k].value=controls[k];$('#'+k+'Value').textContent=Math.round(controls[k])+'px'}document.documentElement.style.setProperty('--stick-size',controls.size+'px');document.documentElement.style.setProperty('--stick-left',controls.left+'px');document.documentElement.style.setProperty('--stick-bottom',controls.bottom+'px')}
function saveControls(){try{localStorage.setItem('hyper-break-controls-v1',JSON.stringify(controls))}catch{}}
for(let [k,input] of Object.entries(sliders))input.addEventListener('input',()=>{controls[k]=+input.value;applyControls();saveControls()});
$('#settingsButton').onclick=()=>{settingsOpen=true;$('#settings').classList.add('open');applyControls()};$('#closeSettings').onclick=()=>{settingsOpen=false;$('#settings').classList.remove('open')};$('#resetControls').onclick=()=>{controls={...controlDefaults};applyControls();saveControls()};addEventListener('resize',applyControls);applyControls();
function steer(e){let r=stick.getBoundingClientRect(),v=clamp((e.clientX-r.left-r.width/2)/(r.width*.35),-1,1);stickX=v;knob.style.transform=`translate(calc(-50% + ${v*r.width*.29}px),-50%)`}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);steer(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)steer(e)});function stopStick(e){if(e.pointerId!==stickPointer)return;stickPointer=null;stickX=0;knob.style.transform='translate(-50%,-50%)'}stick.addEventListener('pointerup',stopStick);stick.addEventListener('pointercancel',stopStick);
addEventListener('keydown',e=>{if(['Space','ArrowLeft','ArrowRight','ArrowUp'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.repeat)return;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jump();if(e.code==='ShiftLeft'||e.code==='ShiftRight')dash();if(e.code==='KeyJ')attack();if(e.code==='KeyK')aim()});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();stickX=0;stickPointer=null;knob.style.transform='translate(-50%,-50%)'});
// Keep iPad Safari from enlarging the page on rapid taps and gestures.
addEventListener('dblclick',e=>e.preventDefault(),{passive:false});addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});let lastTouchEnd=0;addEventListener('touchend',e=>{let now=Date.now();if(now-lastTouchEnd<300)e.preventDefault();lastTouchEnd=now},{passive:false});
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function solidBody(o,dt){o.x+=o.vx*dt;o.x=clamp(o.x,0,WORLD-o.w);for(let p of platforms){if(!overlap(o,p))continue;if(o.vx>0)o.x=p.x-o.w;else if(o.vx<0)o.x=p.x+p.w;o.vx=0}
 o.y+=o.vy*dt;o.onGround=false;for(let p of platforms){if(!overlap(o,p))continue;if(o.vy>=0){o.y=p.y-o.h;o.vy=0;o.onGround=true}else{o.y=p.y+p.h;o.vy=0}}}
function damageEnemy(e,amount,dir){if(e.hp<=0)return;e.hp-=amount;e.hit=.14;e.vx+=dir*160;sparks(e.x+e.w/2,e.y+e.h/2,e.type==='drone'?'#64dfff':'#ff7298',12);shake=6;if(e.hp<=0){score+=e.type==='drone'?150:100;combo++;comboClock=2.5;player.energy=Math.min(100,player.energy+8);sparks(e.x+e.w/2,e.y+e.h/2,'#ffdb83',18);if(combo%5===0)message(`${combo} HIT · OVERDRIVE!`)}}
function hurt(amount,dir){if(player.invulnerable>0||player.dead)return;player.hp=Math.max(0,player.hp-amount);player.invulnerable=.8;player.vx=dir*270;player.vy=-250;shake=13;flash=.18;sparks(player.x+16,player.y+20,'#ff809d',15);combo=0;comboClock=0;if(player.hp<=0){player.dead=true;$('#result').textContent=`점수 ${score.toLocaleString()} · 웨이브 ${wave}`;$('#end').classList.add('open')}}
function step(dt){if(player.dead||settingsOpen)return;elapsed+=dt;shake=Math.max(0,shake-35*dt);flash=Math.max(0,flash-dt);if(elapsed>noticeUntil)$('#message').classList.remove('show');comboClock=Math.max(0,comboClock-dt);if(!comboClock)combo=0;
 player.attackTime=Math.max(0,player.attackTime-dt);player.comboWindow=Math.max(0,player.comboWindow-dt);player.fireCooldown=Math.max(0,player.fireCooldown-dt);player.dashCooldown=Math.max(0,player.dashCooldown-dt);player.dashTime=Math.max(0,player.dashTime-dt);player.invulnerable=Math.max(0,player.invulnerable-dt);player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);player.energy=Math.min(100,player.energy+17*dt);
 let direction=clamp(stickX+Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft')),-1,1);
 if(player.dashTime<=0){let target=direction*320;player.vx+=(target-player.vx)*Math.min(1,(player.onGround?18:11)*dt);if(direction)player.face=direction;player.vy+=GRAVITY*dt}else player.vy+=GRAVITY*.3*dt;
 player.coyote=player.onGround?.1:Math.max(0,player.coyote-dt);if(player.jumpBuffer>0&&(player.coyote>0||player.jumps<2)){let doubleJump=player.jumps===1;player.vy=doubleJump?-635:-705;if(doubleJump){jumpBursts.push({x:player.x+16,y:player.y+player.h,life:.38,max:.38});sparks(player.x+16,player.y+player.h,'#a8adff',23);shake=5}player.jumps++;player.onGround=false;player.coyote=0;player.jumpBuffer=0;sparks(player.x+16,player.y+player.h,'#65e9fa',9)}
 solidBody(player,dt);if(player.onGround)player.jumps=0;
 for(let e of enemies){if(e.hp<=0)continue;e.hit=Math.max(0,e.hit-dt);e.attackCooldown-=dt;let delta=player.x-e.x,near=Math.abs(delta)<360;e.dir=delta<0?-1:1;
 if(e.type==='drone'){e.phase+=dt*3;e.y=FLOOR-170+Math.sin(e.phase)*22;e.x=clamp(e.x+(near?e.dir*47:Math.sin(e.phase)*12)*dt,0,WORLD-e.w);if(near&&e.attackCooldown<=0){let len=Math.hypot(player.x-e.x,player.y-e.y)||1;shots.push({x:e.x+e.w/2,y:e.y+e.h/2,vx:(player.x-e.x)/len*410,vy:(player.y-e.y)/len*410,life:2,enemy:true,damage:12});e.attackCooldown=1.8}}else{let pursuit=near?e.dir*95:0;e.vx+=(pursuit-e.vx)*Math.min(1,8*dt);e.vy+=GRAVITY*dt;solidBody(e,dt);if(overlap(e,player)&&e.attackCooldown<=0){hurt(12,e.dir);e.attackCooldown=1.1}}
 if(player.attackTime>0&&e.lastAttack!==player.attackId){let reach=[0,82,92,112][player.attackStage],dx=e.x+e.w/2-(player.x+player.w/2),dy=Math.abs(e.y+e.h/2-(player.y+player.h/2));if(dx*player.face>-16&&dx*player.face<reach&&dy<68){e.lastAttack=player.attackId;damageEnemy(e,[0,23,27,42][player.attackStage],player.face)}}}
 for(let b of shots){let oldX=b.x,oldY=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0)continue;if(!b.enemy){for(let e of enemies){if(e.hp<=0)continue;let t=clamp(((e.x+e.w/2-oldX)*(b.x-oldX)+(e.y+e.h/2-oldY)*(b.y-oldY))/((b.x-oldX)**2+(b.y-oldY)**2||1),0,1),cx=oldX+(b.x-oldX)*t,cy=oldY+(b.y-oldY)*t;if(Math.abs(cx-(e.x+e.w/2))<e.w/2+5&&Math.abs(cy-(e.y+e.h/2))<e.h/2+5){damageEnemy(e,b.damage,Math.sign(b.vx));b.life=0;break}}}else if(b.x>player.x&&b.x<player.x+player.w&&b.y>player.y&&b.y<player.y+player.h){hurt(b.damage,Math.sign(b.vx));b.life=0}
 if(b.life>0&&platforms.some(p=>b.x>p.x&&b.x<p.x+p.w&&b.y>p.y&&b.y<p.y+p.h))b.life=0}
 shots=shots.filter(b=>b.life>0&&b.x>=0&&b.x<WORLD);enemies=enemies.filter(e=>e.hp>0);
 for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=420*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(let s of slashes)s.life-=dt;slashes=slashes.filter(s=>s.life>0);for(let ring of jumpBursts)ring.life-=dt;jumpBursts=jumpBursts.filter(ring=>ring.life>0);

 }
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function backdrop(){let gradient=ctx.createLinearGradient(0,0,0,H);gradient.addColorStop(0,'#081022');gradient.addColorStop(.64,'#172641');gradient.addColorStop(1,'#283c59');rect(0,0,W,H,gradient);
 ctx.save();ctx.translate(-cameraX*scale*.19,0);for(let x=-300;x<W/scale+WORLD*.19;x+=165){let h=160+(Math.floor(x/165)*83%120);rect(x*scale,H-h*scale,105*scale,h*scale,'#2239547d');rect((x+14)*scale,H-(h-18)*scale,8*scale,18*scale,'#5ee7fc22')}ctx.restore();
 ctx.save();ctx.translate(-cameraX*scale*.45,0);for(let x=-200;x<WORLD;x+=340){let h=140+(x*7%110);rect(x*scale,H-h*scale,230*scale,h*scale,'#142b46ab');for(let j=0;j<4;j++)rect((x+28+j*49)*scale,H-(h-34)*scale,20*scale,5*scale,'#4ac8e04b')}ctx.restore();

function drawPlayer(){let p=player;if(p.invulnerable>0&&Math.floor(elapsed*18)%2)return;ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);ctx.scale(p.face,1);
 if(p.dashTime>0){ctx.globalAlpha=.28;rect(-72,-29,34,55,'#74ecff');rect(-119,-22,30,44,'#74ecff');ctx.globalAlpha=1}
 rect(-12,-16,25,36,p.attackTime>0?'#72f0fd':'#49b6dd');rect(-12,20,10,13,'#17304a');rect(3,20,10,13,'#17304a');rect(-11,-27,23,17,'#203b59');rect(3,-21,11,5,'#e7fdff');rect(7,-7,27,8,'#d6f4ff');rect(23,-9,12,4,'#8be8ff');rect(-16,-12,6,21,'#356481');ctx.restore()}
function drawEnemy(e){ctx.save();ctx.translate(e.x+e.w/2,e.y+e.h/2);ctx.scale(e.dir,1);let c=e.hit>0?'#fff0f1':e.type==='drone'?'#b165e4':'#e0638d';if(e.type==='drone'){ctx.fillStyle='#ae74dd35';ctx.beginPath();ctx.ellipse(0,0,29,23,0,0,7);ctx.fill();rect(-19,-11,38,22,c);rect(4,-4,9,5,'#ffe9fd');rect(-29,-3,10,5,'#9137b5');rect(19,-3,10,5,'#9137b5')}else{rect(-15,-17,30,39,c);rect(-14,20,11,5,'#7f2a55');rect(3,20,11,5,'#7f2a55');rect(1,-9,9,5,'#fff1f5');rect(13,0,15,8,'#994568')}ctx.restore();rect(e.x,e.y-11,e.w,4,'#1b2639');rect(e.x,e.y-11,e.w*Math.max(0,e.hp/e.max),4,'#ff789e')}
function drawWorld(){ctx.save();let jx=shake?rand(-shake,shake):0,jy=shake?rand(-shake,shake):0;ctx.setTransform(dpr*scale,0,0,dpr*scale,-cameraX*dpr*scale+jx*dpr,jy*dpr);
 for(let p of platforms){rect(p.x,p.y,p.w,p.h,'#24334d');rect(p.x,p.y,p.w,7,'#4bd2df');rect(p.x,p.y+7,p.w,3,'#141d36');for(let x=p.x+20;x<p.x+p.w;x+=70)rect(x,p.y+16,24,4,'#5bc3d448')}
 for(let b of shots){ctx.strokeStyle=b.enemy?'#ff789d':'#8fffff';ctx.lineWidth=b.enemy?5:4;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=13;ctx.beginPath();ctx.moveTo(b.x-b.vx*.012,b.y-b.vy*.012);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.shadowBlur=0}
 for(let e of enemies)drawEnemy(e);drawPlayer();for(let ring of jumpBursts){let progress=1-ring.life/ring.max;ctx.globalAlpha=ring.life/ring.max;ctx.strokeStyle='#a6b8ff';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(ring.x,ring.y,15+progress*70,8+progress*25,0,0,7);ctx.stroke()}ctx.globalAlpha=1;for(let s of slashes){ctx.globalAlpha=s.life/s.max;ctx.strokeStyle=s.stage===3?'#ffd594':'#8ff5ff';ctx.lineWidth=s.stage===3?12:8;ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=16;ctx.beginPath();ctx.arc(s.x,s.y,38+s.stage*9,s.face>0?-.95:Math.PI-.95,s.face>0?.95:Math.PI+.95);ctx.stroke();ctx.shadowBlur=0}ctx.globalAlpha=1;

function hud(){let hp=Math.ceil(player.hp),en=Math.floor(player.energy);$('#hpText').textContent=`${hp} / 100`;$('#hpBar').style.width=hp+'%';$('#energyText').textContent=`${en} / 100`;$('#energyFill').style.width=en+'%';$('#score').textContent=score.toLocaleString();$('#wave').textContent=`웨이브 ${wave}`;$('#combo').textContent=combo>1?`${combo} HIT COMBO`:''}
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;accum=Math.min(.1,accum+dt);while(accum>=1/120){let realStep=1/120;if(!settingsOpen){aimCooldown=Math.max(0,aimCooldown-realStep);if(aimRemaining>0){aimRemaining=Math.max(0,aimRemaining-realStep);if(aimRemaining===0&&!aimFired){aimRemaining=.001;aimedShot();aimRemaining=0}}step(realStep*(aimRemaining>0?.1:1))}accum-=realStep}cameraX=clamp(player.x-W/scale*.34,0,Math.max(0,WORLD-W/scale));backdrop();drawWorld();hud();requestAnimationFrame(frame)}requestAnimationFrame(frame);
