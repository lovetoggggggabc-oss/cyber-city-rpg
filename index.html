<style>

#end{position:absolute;inset:0;display:none;place-items:center;background:#040915cf;pointer-events:auto;text-align:center}#end.open{display:grid}#end .panel{padding:24px 32px;max-width:92vw}#end h1{color:#ff8ca8;margin:0 0 8px}#end p{color:#b8d0e0}#restart{border-radius:10px;padding:11px 22px;cursor:pointer}

@media(max-width:700px){#hint{display:none}#status{min-width:150px;padding:7px 9px}#info{min-width:90px;padding:7px 9px}.bar{width:138px}#hud{top:calc(6px + env(safe-area-inset-top));left:7px;right:7px}.line{font-size:10px}.title{font-size:9px}#info strong{font-size:13px}.left{width:63px;height:63px;bottom:calc(13px + env(safe-area-inset-bottom))}.left#left{left:8px}.left#right{left:80px}.action{width:55px;height:55px;font-size:11px;bottom:calc(15px + env(safe-area-inset-bottom))}#attack{width:77px;height:77px;right:6px;font-size:15px}#shoot{right:90px;bottom:calc(16px + env(safe-area-inset-bottom))}#jump{right:12px;bottom:calc(100px + env(safe-area-inset-bottom))}#dash{right:84px;bottom:calc(82px + env(safe-area-inset-bottom))}}

<body>
<canvas id="game" aria-label="2D 횡스크롤 액션 게임"></canvas>
<div id="ui">
  <div id="hud"><div id="status" class="glass"><div class="title">세라케인 · NYX</div><div class="line"><span>체력</span><b id="hpText">100 / 100</b></div><div class="bar"><i id="hpBar"></i></div><div class="line"><span>에너지</span><b id="energyText">100 / 100</b></div><div class="bar" id="energyBar"><i id="energyFill"></i></div></div><div id="info" class="glass"><button id="settingsButton" aria-label="조작 설정">설정 ⚙</button><span>점수</span><strong id="score">0</strong><span id="wave">웨이브 1</span><div id="skill">조준 준비 · 휘어진 일격 0/4</div><div id="combo"></div></div></div>
  <div id="hint">A/D · ←/→ 이동　Space 점프(2회)　J 일반 공격　K 조준　E 휘어진 일격　공격 버튼 끌어서 조준 후 놓기　Shift 대시</div><div id="message"></div>
  <div id="touch"><div id="stick" aria-label="이동 조이스틱"><div id="knob"></div></div><button id="curve" class="control action">휘어진<small>E · 0/4</small></button><button id="focus" class="control action">조준<small>K</small></button><button id="dash" class="control action">대시<small>Shift</small></button><button id="jump" class="control action">점프<small>Space</small></button><button id="attack" class="control action" aria-label="일반 공격">공격<small>J</small><span id="attackKnob"></span></button></div>
  <div id="settings"><div class="panel glass"><h2>조이스틱 설정</h2><p>크기와 화면 왼쪽·아래에서 떨어진 거리를 조절할 수 있어.</p><label>크기 <output id="sizeValue"></output><input id="stickSize" type="range" min="80" max="180" step="1"></label><label>왼쪽 위치 <output id="leftValue"></output><input id="stickLeft" type="range" min="8" max="220" step="1"></label><label>아래 위치 <output id="bottomValue"></output><input id="stickBottom" type="range" min="8" max="220" step="1"></label><div><button id="resetControls">기본값</button><button id="closeSettings">닫기</button></div></div></div><div id="end"><div class="panel glass"><h1>신호 소실</h1><p id="result"></p><button id="restart">다시 시작</button></div></div>
  <div id="agentSelect"><div class="panel glass"><h1>요원 선택</h1><p>이번 전투에서 사용할 요원을 골라줘.</p><div id="agents"><button id="chooseNyx"><strong>세라케인 · NYX</strong><span>조준 사격 · 휘어진 일격<br>명중하면 조준 쿨타임 감소</span></button><button id="chooseNova"><strong>아라타 진 · NOVA</strong><span>접착 폭탄 · 폭탄 부츠<br>폭탄 두 개를 붙이면 연쇄 폭발</span></button></div></div></div>
</div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s);
const WORLD=3200,FLOOR=590,GRAVITY=1800,AIM_DURATION=.8,keys=new Set();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);
const platforms=[{x:0,y:FLOOR,w:WORLD,h:180},{x:430,y:480,w:205,h:20},{x:820,y:422,w:190,h:20},{x:1170,y:490,w:250,h:20},{x:1570,y:430,w:200,h:20},{x:1930,y:470,w:245,h:20},{x:2310,y:405,w:205,h:20},{x:2670,y:475,w:225,h:20}];
let W=innerWidth,H=innerHeight,dpr=1,scale=1,cameraX=0,elapsed=0,last=performance.now(),accum=0,shake=0,flash=0,score=0,wave=1,combo=0,comboClock=0,waveDelay=-1,noticeUntil=0;
let selectedAgent=null,stickyBombs=[],bombAmmo=2,bombReloads=[],stickyPending=false,bootsCooldown=0,bootStage=null,player,enemies=[],shots=[],particles=[],jumpBursts=[],aimRemaining=0,aimFired=false,aimMode="focus",aimTarget={x:0,y:0},aimCooldown=0,curveHits=0,basicCooldown=0,attackPointer=null,attackDir={x:1,y:0},aimFollowup=0,aimJumped=false,aimIsChain=false,stickX=0,stickPointer=null,settingsOpen=false;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);scale=H/720;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function hero(){return{x:160,y:FLOOR-56,w:32,h:56,vx:0,vy:0,face:1,hp:100,energy:100,onGround:true,jumps:0,coyote:0,jumpBuffer:0,dashCooldown:0,dashTime:0,invulnerable:0,dead:false}}
function enemy(x,type='runner'){let flying=type==='drone',boss=type==='scrap'||type==='glitch',hp=type==='scrap'?1500:type==='glitch'?2000:flying?35:55,h=type==='scrap'?61:type==='glitch'?54:flying?30:46,w=type==='scrap'?52:type==='glitch'?39:flying?38:32;return{x,y:flying?FLOOR-165:FLOOR-h,w,h,vx:0,vy:0,hp,maxHp:hp,type,dir:-1,attackCooldown:boss?1.2:rand(.5,1.3),hit:0,phase:rand(0,7),state:'idle',timer:0,targetX:0,targetY:0,volleyLeft:0}}
function reset(){player=hero();stickyBombs=[];bombAmmo=2;bombReloads=[];stickyPending=false;bootsCooldown=0;bootStage=null;enemies=[enemy(565),enemy(830,'scrap'),enemy(1160,'drone'),enemy(1520,'glitch'),enemy(1970),enemy(2380,'scrap')];shots=[];particles=[];jumpBursts=[];aimRemaining=0;aimFired=false;aimMode="focus";aimCooldown=0;curveHits=0;basicCooldown=0;attackPointer=null;attackDir={x:1,y:0};aimFollowup=0;aimJumped=false;aimIsChain=false;score=0;wave=1;combo=0;comboClock=0;waveDelay=-1;elapsed=0;shake=0;flash=0;$('#end').classList.remove('open');message(selectedAgent==='nova'?'NOVA · 전투 개시':'NYX · 전투 개시');last=performance.now();accum=0}
$('#restart').addEventListener('click',reset);reset();function chooseAgent(agent){selectedAgent=agent;$('#agentSelect').classList.add('closed');$('#focus').firstChild.textContent=agent==='nova'?'접착':'조준';$('#curve').firstChild.textContent=agent==='nova'?'폭탄 부츠':'휘어진';$('#focus').style.background=agent==='nova'?'#85502fe3':'';$('#curve').style.background=agent==='nova'?'#87503be0':'';$('#hint').textContent=agent==='nova'?'A/D 이동 · Space 점프 · J 일반 공격 · K 접착 폭탄 · E 폭탄 부츠 · Shift 대시':'A/D 이동 · Space 점프 · J 일반 공격 · K 조준 · E 휘어진 일격 · Shift 대시';reset()}$('#chooseNyx').addEventListener('click',()=>chooseAgent('nyx'));$('#chooseNova').addEventListener('click',()=>chooseAgent('nova'));
function message(text){$('#message').textContent=text;$('#message').classList.add('show');noticeUntil=elapsed+1.6}
function sparks(x,y,color,count=12){for(let i=0;i<count;i++)particles.push({x,y,vx:rand(-260,260),vy:rand(-320,110),life:rand(.18,.48),max:.48,color,size:rand(2,5)})}
function jump(){if(player.dead||settingsOpen)return;player.jumpBuffer=.12;if(aimRemaining>0)aimJumped=true}
function dash(){if(player.dead||settingsOpen||player.dashCooldown>0)return;let chain=selectedAgent==='nyx'&&aimRemaining===0&&aimFollowup>0;aimFollowup=0;player.dashTime=.16;player.dashCooldown=.75;player.vx=player.face*850;player.vy*=.25;player.invulnerable=Math.max(player.invulnerable,.22);shake=6;sparks(player.x+16,player.y+32,'#69ecff',8);if(chain){aim(true);message('DASH LINK · 추가 조준')}}
function aim(chain=false){if(selectedAgent!=='nyx'||player.dead||settingsOpen||aimRemaining>0||(!chain&&aimCooldown>0))return;aimMode='focus';aimRemaining=AIM_DURATION;aimFired=false;aimIsChain=chain;aimFollowup=0;aimJumped=!player.onGround||player.jumpBuffer>0;if(!chain)aimCooldown=7;aimTarget={x:player.x+16+player.face*500,y:player.y+26};message(chain?'연계 조준 · 한 발 더!':'조준 · 화면을 터치해 발사')}
function curvedStrike(){if(selectedAgent!=='nyx'||player.dead||settingsOpen||aimRemaining>0||curveHits<4)return;curveHits=0;aimMode='curve';aimRemaining=1;aimFired=false;aimFollowup=0;aimJumped=false;aimTarget={x:player.x+16+player.face*500,y:player.y+26};message('휘어진 일격 · 화면을 터치해 발사')}
function basicShot(dx=player.face,dy=0){if(player.dead||settingsOpen||basicCooldown>0)return;let len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,mx=player.x+16,my=player.y+26;player.face=ux<0?-1:1;shots.push({x:mx+ux*25,y:my+uy*25,vx:ux*1050,vy:uy*1050,life:.8,enemy:false,damage:45});basicCooldown=.2;sparks(mx+ux*20,my+uy*20,'#8ff5ff',5)}
function aimedShot(){if(player.dead||aimRemaining<=0||aimFired)return;aimFired=true;let mx=player.x+16,my=player.y+26,dx=aimTarget.x-mx,dy=aimTarget.y-my,len=Math.hypot(dx,dy)||1;if(dx)player.face=Math.sign(dx);shots.push({x:mx+dx/len*28,y:my+dy/len*28,vx:dx/len*1700,vy:dy/len*1700,life:.85,enemy:false,damage:aimMode==='curve'?1000:550,focus:true,kind:aimMode,phase:aimMode==='curve'?1:0,ignoreTerrain:aimMode==='curve'});sparks(mx+player.face*24,my,'#94f6ff',12);shake=5}
function targetAt(e){aimTarget.x=clamp(cameraX+e.clientX/scale,0,WORLD);aimTarget.y=clamp(e.clientY/scale,20,FLOOR+30)}
let aimingTouch=null;canvas.addEventListener('pointerdown',e=>{if(aimRemaining<=0)return;e.preventDefault();targetAt(e);if(e.pointerType==='mouse')aimedShot();else{aimingTouch=e.pointerId;canvas.setPointerCapture(e.pointerId)}});canvas.addEventListener('pointermove',e=>{if(aimRemaining>0&&(e.pointerType==='mouse'||e.pointerId===aimingTouch))targetAt(e)});canvas.addEventListener('pointerup',e=>{if(e.pointerId===aimingTouch){targetAt(e);aimedShot();aimingTouch=null}});canvas.addEventListener('pointercancel',()=>aimingTouch=null);

const action={jump,dash,focus:()=>selectedAgent==='nova'?stickBomb():aim(),curve:()=>selectedAgent==='nova'?bombBoots():curvedStrike()};for(let [id,fn] of Object.entries(action))$('#'+id).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();e.currentTarget.setPointerCapture(e.pointerId);fn()});
const attackButton=$('#attack'),attackKnob=$('#attackKnob');function steerAttack(e){let r=attackButton.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.hypot(dx,dy);if(len>8){attackDir={x:dx/len,y:dy/len};attackKnob.style.transform=`translate(calc(-50% + ${attackDir.x*r.width*.26}px),calc(-50% + ${attackDir.y*r.height*.26}px))`}}attackButton.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();attackPointer=e.pointerId;attackDir={x:player.face,y:0};attackButton.setPointerCapture(e.pointerId);steerAttack(e)});attackButton.addEventListener('pointermove',e=>{if(e.pointerId===attackPointer)steerAttack(e)});attackButton.addEventListener('pointerup',e=>{if(e.pointerId!==attackPointer)return;steerAttack(e);basicShot(attackDir.x,attackDir.y);attackPointer=null;attackKnob.style.transform='translate(-50%,-50%)'});attackButton.addEventListener('pointercancel',()=>{attackPointer=null;attackKnob.style.transform='translate(-50%,-50%)'});
const stick=$('#stick'),knob=$('#knob'),controlDefaults={size:112,left:18,bottom:18};let controls={...controlDefaults};
try{let stored=JSON.parse(localStorage.getItem('hyper-break-controls-v1')||'{}');for(let k of Object.keys(controlDefaults))if(Number.isFinite(+stored[k]))controls[k]=+stored[k]}catch{}
const sliders={size:$('#stickSize'),left:$('#stickLeft'),bottom:$('#stickBottom')};
function applyControls(){controls.size=clamp(controls.size,80,180);controls.left=clamp(controls.left,8,Math.max(8,W-controls.size-8));controls.bottom=clamp(controls.bottom,8,Math.max(8,H-controls.size-8));for(let k of Object.keys(sliders)){sliders[k].value=controls[k];$('#'+k+'Value').textContent=Math.round(controls[k])+'px'}document.documentElement.style.setProperty('--stick-size',controls.size+'px');document.documentElement.style.setProperty('--stick-left',controls.left+'px');document.documentElement.style.setProperty('--stick-bottom',controls.bottom+'px')}
function saveControls(){try{localStorage.setItem('hyper-break-controls-v1',JSON.stringify(controls))}catch{}}
for(let [k,input] of Object.entries(sliders))input.addEventListener('input',()=>{controls[k]=+input.value;applyControls();saveControls()});
$('#settingsButton').onclick=()=>{settingsOpen=true;$('#settings').classList.add('open');applyControls()};$('#closeSettings').onclick=()=>{settingsOpen=false;$('#settings').classList.remove('open')};$('#resetControls').onclick=()=>{controls={...controlDefaults};applyControls();saveControls()};addEventListener('resize',applyControls);applyControls();
function steer(e){let r=stick.getBoundingClientRect(),v=clamp((e.clientX-r.left-r.width/2)/(r.width*.35),-1,1);stickX=v;knob.style.transform=`translate(calc(-50% + ${v*r.width*.29}px),-50%)`}
stick.addEventListener('pointerdown',e=>{e.preventDefault();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);steer(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)steer(e)});function stopStick(e){if(e.pointerId!==stickPointer)return;stickPointer=null;stickX=0;knob.style.transform='translate(-50%,-50%)'}stick.addEventListener('pointerup',stopStick);stick.addEventListener('pointercancel',stopStick);
addEventListener('keydown',e=>{if(['Space','ArrowLeft','ArrowRight','ArrowUp'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.repeat)return;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jump();if(e.code==='ShiftLeft'||e.code==='ShiftRight')dash();if(e.code==='KeyJ')basicShot();if(e.code==='KeyK')(selectedAgent==='nova'?stickBomb():aim());if(e.code==='KeyE')(selectedAgent==='nova'?bombBoots():curvedStrike());});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();stickX=0;stickPointer=null;knob.style.transform='translate(-50%,-50%)'});
// Keep iPad Safari from enlarging the page on rapid taps and gestures.
